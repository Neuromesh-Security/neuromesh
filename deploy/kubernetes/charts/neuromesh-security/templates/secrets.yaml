{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.policyBundleToken.name }}
  namespace: {{ include "neuromesh.namespace" . }}
type: Opaque
stringData:
  token: {{ .Values.secrets.policyBundleToken.token | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.policyBundleSigningKey.name }}
  namespace: {{ include "neuromesh.namespace" . }}
type: Opaque
stringData:
  signing.pem: |-
{{ .Values.secrets.policyBundleSigningKey.signingPem | indent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.policyBundlePubkey.name }}
  namespace: {{ include "neuromesh.namespace" . }}
type: Opaque
stringData:
  bundle.pub: |-
{{ .Values.secrets.policyBundlePubkey.bundlePub | indent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.spiffeTrustBundle.name }}
  namespace: {{ include "neuromesh.namespace" . }}
type: Opaque
stringData:
  bundle.pem: |-
{{ .Values.secrets.spiffeTrustBundle.bundlePem | indent 4 }}
{{- /* neuromesh-cosign-pubkey is always rendered by cosign-pubkey-secret.yaml
     (CI public key default) when agent.enabled — not gated on secrets.create. */}}
{{- /* When certManager.enabled, the leaf Certificate owns this Secret — do not
     create/overwrite it from Helm values (delete-before-write / fight CM). */}}
{{- if not .Values.certManager.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.admissionWebhookTls.name }}
  namespace: {{ include "neuromesh.namespace" . }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.secrets.admissionWebhookTls.tlsCrt | quote }}
  tls.key: {{ .Values.secrets.admissionWebhookTls.tlsKey | quote }}
{{- end }}
{{- end }}
