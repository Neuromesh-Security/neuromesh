{{- /*
  Always provision the CI Cosign verify public key when the agent runs.
  Independent of secrets.create: the pubkey is public material (ci-cosign.pub)
  and the agent image does not bake it — missing mount ⇒ CrashLoop
  "Cosign public key missing at /etc/neuromesh/cosign/cosign.pub".
  Override with secrets.cosignPubkey.cosignPub when non-empty.
*/ -}}
{{- if .Values.agent.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.cosignPubkey.name }}
  namespace: {{ include "neuromesh.namespace" . }}
  labels:
    app.kubernetes.io/name: neuromesh
    app.kubernetes.io/part-of: neuromesh
    app.kubernetes.io/component: cosign-pubkey
type: Opaque
stringData:
  cosign.pub: |
{{- $pem := .Values.secrets.cosignPubkey.cosignPub | default (.Files.Get "files/ci-cosign.pub") }}
{{ $pem | indent 4 }}
{{- end }}
