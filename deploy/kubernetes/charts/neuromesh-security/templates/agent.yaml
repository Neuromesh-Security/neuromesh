{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: neuromesh-agent
  namespace: {{ include "neuromesh.namespace" . }}
  labels:
    app.kubernetes.io/name: neuromesh-agent
    app.kubernetes.io/component: ebpf-sensor
    app.kubernetes.io/part-of: neuromesh
    app.kubernetes.io/version: "0.1.0"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: neuromesh-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neuromesh-agent
        app.kubernetes.io/component: ebpf-sensor
        app.kubernetes.io/part-of: neuromesh
      annotations:
        container.apparmor.security.beta.kubernetes.io/agent: unconfined
    spec:
      serviceAccountName: neuromesh-agent
      hostPID: true
      hostNetwork: false
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: agent
          image: {{ include "neuromesh.imageRef" .Values.images.agent }}
          imagePullPolicy: {{ .Values.images.agent.pullPolicy }}
          command: ["/usr/local/bin/agent-ebpf-sensor"]
          env:
            - name: RUST_LOG
              value: {{ .Values.agent.env.rustLog | quote }}
            - name: NEUROMESH_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NEUROMESH_COSIGN_PUBLIC_KEY_PATH
              value: {{ .Values.agent.env.cosignPublicKeyPath | quote }}
            - name: NEUROMESH_BYTECODE_MANIFEST_PATH
              value: {{ .Values.agent.env.bytecodeManifestPath | quote }}
            - name: NEUROMESH_BYTECODE_MANIFEST_SIG_PATH
              value: {{ .Values.agent.env.bytecodeManifestSigPath | quote }}
            - name: NEUROMESH_POLICY_BUNDLE_TOKEN_FILE
              value: {{ .Values.agent.env.policyBundleTokenFile | quote }}
            - name: NEUROMESH_ZT_POLICY_ENGINE_URL
              value: {{ .Values.agent.env.policyEngineUrl | quote }}
            - name: NEUROMESH_POLICY_BUNDLE_PUBLIC_KEY_PATH
              value: {{ .Values.agent.env.policyBundlePublicKeyPath | quote }}
            - name: NEUROMESH_IDENTITY_CORRELATOR
              value: {{ .Values.agent.env.identityCorrelator | quote }}
            - name: NEUROMESH_CGROUP_ROOT
              value: {{ .Values.agent.env.cgroupRoot | quote }}
            {{- if .Values.agent.env.pathDenyKeyBytes }}
            - name: PATH_DENY_KEY_BYTES
              value: {{ .Values.agent.env.pathDenyKeyBytes | quote }}
            {{- end }}
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add:
                - BPF
                - SYS_ADMIN
                - SYS_RESOURCE
                - PERFMON
                - SYS_PTRACE
          volumeMounts:
            - name: sys-fs-bpf
              mountPath: /sys/fs/bpf
            - name: debugfs
              mountPath: /sys/kernel/debug
              readOnly: true
            - name: tracefs
              mountPath: /sys/kernel/tracing
              readOnly: true
            - name: host-root
              mountPath: /host
              readOnly: true
              mountPropagation: HostToContainer
            - name: tmp
              mountPath: /tmp
            - name: cosign-pubkey
              mountPath: /etc/neuromesh/cosign
              readOnly: true
            - name: policy-bundle-token
              mountPath: /etc/neuromesh/policy-bundle
              readOnly: true
            - name: policy-bundle-pubkey
              mountPath: /etc/neuromesh/policy-bundle-pubkey
              readOnly: true
          resources:
{{ toYaml .Values.agent.resources | indent 12 }}
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "pgrep -x agent-ebpf-sensor"]
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: sys-fs-bpf
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
            type: Directory
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: tmp
          emptyDir: {}
        - name: cosign-pubkey
          secret:
            secretName: {{ .Values.secrets.cosignPubkey.name }}
            items:
              - key: cosign.pub
                path: cosign.pub
        - name: policy-bundle-token
          secret:
            secretName: {{ .Values.secrets.policyBundleToken.name }}
            items:
              - key: token
                path: token
        - name: policy-bundle-pubkey
          secret:
            secretName: {{ .Values.secrets.policyBundlePubkey.name }}
            items:
              - key: bundle.pub
                path: bundle.pub
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: neuromesh-agent
  namespace: {{ include "neuromesh.namespace" . }}
  labels:
    app.kubernetes.io/name: neuromesh-agent
    app.kubernetes.io/part-of: neuromesh
{{- end }}
