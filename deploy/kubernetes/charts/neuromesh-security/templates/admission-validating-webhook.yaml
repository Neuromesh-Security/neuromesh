{{- if and .Values.admissionWebhook.enabled .Values.validatingWebhook.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: neuromesh-validate-pods
  labels:
    app.kubernetes.io/name: neuromesh-admission-webhook
    app.kubernetes.io/part-of: neuromesh
{{- if .Values.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ printf "%s/neuromesh-admission-webhook-ca" (include "neuromesh.namespace" .) | quote }}
{{- end }}
webhooks:
  - name: neuromesh.security.validate-pods
    clientConfig:
      service:
        name: neuromesh-admission-webhook
        namespace: {{ include "neuromesh.namespace" . }}
        path: /validate
        port: {{ .Values.admissionWebhook.service.port }}
{{- if .Values.certManager.enabled }}
      # cainjector fills from CA Secret (merge behavior requires cert-manager ≥ 1.19).
      caBundle: ""
{{- else }}
      caBundle: {{ .Values.validatingWebhook.caBundle | quote }}
{{- end }}
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.validatingWebhook.failurePolicy }}
    matchPolicy: {{ .Values.validatingWebhook.matchPolicy }}
    timeoutSeconds: {{ .Values.validatingWebhook.timeoutSeconds }}
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
    objectSelector:
      matchExpressions:
        - key: app.kubernetes.io/name
          operator: NotIn
          values:
            - neuromesh-admission-webhook
{{- end }}
