namespace:
  create: true
  name: neuromesh-system

images:
  agent:
    repository: ghcr.io/neuromesh-security/neuromesh-agent-ebpf-sensor
    tag: ""
    digest: sha256:413424ce5ec990e97b58014daa05ae8addab27de5afcac74904eb28fdcd5de2d
    pullPolicy: IfNotPresent
  policyEngine:
    repository: ghcr.io/neuromesh-security/neuromesh-zt-policy-engine
    tag: ""
    digest: sha256:eceb694cc12409a935ca3d83a9ac856b0f3e4461131c63b193142aa828572255
    pullPolicy: IfNotPresent
  admissionWebhook:
    repository: ghcr.io/neuromesh-security/neuromesh-k8s-admission-webhook
    tag: ""
    digest: sha256:e3997b4c42763c2a2b488b3b0246e8bddaa071ba5d1328d6abd5ea118370e273
    pullPolicy: IfNotPresent

agent:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    rustLog: info
    policyEngineUrl: http://neuromesh-zt-policy-engine.neuromesh-system.svc.cluster.local:8080
    policyBundleTokenFile: /etc/neuromesh/policy-bundle/token
    policyBundlePublicKeyPath: /etc/neuromesh/policy-bundle-pubkey/bundle.pub
    cosignPublicKeyPath: /etc/neuromesh/cosign/cosign.pub
    bytecodeManifestPath: /etc/neuromesh/bytecode-manifest.json
    bytecodeManifestSigPath: /etc/neuromesh/bytecode-manifest.sig
    identityCorrelator: "1"
    cgroupRoot: /host/sys/fs/cgroup
    pathDenyKeyBytes: ""

policyEngine:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  env:
    port: "8080"
    spiffeTrustDomain: neuromesh.security
    spiffeTrustBundleMode: static_file
    spiffeBundlePath: /etc/neuromesh/spiffe/bundle.pem
    policyBundleTokenFile: /etc/neuromesh/policy-bundle/token
    policyBundleSigningKeyPath: /etc/neuromesh/policy-bundle-signing/signing.pem
    desiredPolicyEnable: "false"
    desiredPolicyConfigMap: neuromesh-desired-policy

admissionWebhook:
  enabled: true
  replicas: 2
  pdb:
    minAvailable: 1
  service:
    port: 443
    targetPort: https
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  env:
    listenAddr: ":8443"
    tlsCertFile: /etc/webhook/certs/tls.crt
    tlsKeyFile: /etc/webhook/certs/tls.key
    cosignPublicKeyPath: /etc/webhook/cosign/cosign.pub
    cosignVerifyMode: key

desiredPolicy:
  enabled: true
  name: neuromesh-desired-policy
  config:
    policyJson: |
      {
        "deny_path_prefixes": ["/tmp/", "/dev/shm/", "/var/tmp/"],
        "identity_allow_exceptions": {
          "scope_path_prefix": "/tmp/",
          "spiffe_ids": [
            "spiffe://neuromesh.security/ns/default/sa/agent-ebpf-sensor",
            "spiffe://neuromesh.security/ns/default/sa/zt-policy-engine",
            "spiffe://neuromesh.security/ns/default/sa/ai-threat-detector"
          ]
        }
      }

validatingWebhook:
  enabled: true
  # Operator CA (base64 PEM). Placeholder is intentional — do not commit a real
  # CA. Inject with scripts/inject_admission_cabundle.sh or:
  #   --set validatingWebhook.caBundle="$(openssl base64 -A -in ca.crt)"
  # Ignored when certManager.enabled=true (cainjector owns caBundle).
  caBundle: REPLACE_WITH_BASE64_CA_BUNDLE
  failurePolicy: Ignore
  matchPolicy: Equivalent
  timeoutSeconds: 15

# Phase B part 2 (Issue #168) — opt-in cert-manager leaf renewal.
# Default false preserves openssl/lab / failurePolicy:Ignore bootstrap.
# Production / Fail graduation: set enabled=true (requires cert-manager ≥ 1.19).
certManager:
  enabled: false
  # Minimum supported: 1.19 (CAInjectorMerging default). Prefer current stable.
  ca:
    duration: 87600h # ~3650d
    renewBefore: 720h # 30d — plan CA runbook; do not blind-replace caBundle
  leaf:
    duration: 2160h # 90d
    renewBefore: 360h # 15d
    dnsNames:
      - neuromesh-admission-webhook
      - neuromesh-admission-webhook.neuromesh-system
      - neuromesh-admission-webhook.neuromesh-system.svc
      - neuromesh-admission-webhook.neuromesh-system.svc.cluster.local

# Phase B part 1 — ingress NetworkPolicies (no new CNI deps; requires a CNI that
# enforces NetworkPolicy — default k3s Flannel + netpol controller does).
networkPolicy:
  enabled: true
  policyEngine:
    enabled: true
  admissionWebhook:
    enabled: true
    # k3s: apiserver is host-networked — use ipBlock, not a podSelector.
    # Default = Flannel server PodCIDR network address as /32 (10.42.0.0/32 when
    # node PodCIDR is 10.42.0.0/24). Discover/override via
    # scripts/manual_verify_network_policies.sh. Do not widen to 10.42.0.0/16
    # unless every Flannel pod is an accepted webhook client.
    apiServerSourceCidrs:
      - 10.42.0.0/32

secrets:
  create: false
  policyBundleToken:
    name: neuromesh-policy-bundle-token
    token: ""
  policyBundleSigningKey:
    name: neuromesh-policy-bundle-signing-key
    signingPem: ""
  policyBundlePubkey:
    name: neuromesh-policy-bundle-pubkey
    bundlePub: ""
  spiffeTrustBundle:
    name: neuromesh-spiffe-trust-bundle
    bundlePem: ""
  cosignPubkey:
    name: neuromesh-cosign-pubkey
    cosignPub: ""
  admissionWebhookTls:
    name: neuromesh-admission-webhook-tls
    tlsCrt: ""
    tlsKey: ""
