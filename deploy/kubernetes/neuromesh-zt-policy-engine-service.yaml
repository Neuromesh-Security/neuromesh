# ClusterIP Service for zt-policy-engine.
# Agent sync URL:
#   http://neuromesh-zt-policy-engine.neuromesh-system.svc.cluster.local:8080
apiVersion: v1
kind: Service
metadata:
  name: neuromesh-zt-policy-engine
  namespace: neuromesh-system
  labels:
    app.kubernetes.io/name: neuromesh-zt-policy-engine
    app.kubernetes.io/component: zt-policy-engine
    app.kubernetes.io/part-of: neuromesh
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: neuromesh-zt-policy-engine
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
