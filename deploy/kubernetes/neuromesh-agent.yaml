---
apiVersion: v1
kind: Namespace
metadata:
  name: neuromesh-system
  labels:
    app.kubernetes.io/name: neuromesh
    app.kubernetes.io/part-of: neuromesh
---
# CI Cosign static public key (secrets.COSIGN_PUBLIC_KEY) — same keypair as
# GHCR image sign + bytecode-manifest sign-blob. Public material; shipped so
# `kubectl apply -f neuromesh-agent.yaml` is self-contained. Image does NOT
# bake this file (fail-closed at /etc/neuromesh/cosign/cosign.pub). Do NOT
# replace with ~/neuromesh-attest-lab keys (GHCR bytecode will fail-closed).
# Source of truth on disk: deploy/kubernetes/ci-cosign.pub
apiVersion: v1
kind: Secret
metadata:
  name: neuromesh-cosign-pubkey
  namespace: neuromesh-system
  labels:
    app.kubernetes.io/name: neuromesh
    app.kubernetes.io/part-of: neuromesh
    app.kubernetes.io/component: cosign-pubkey
type: Opaque
stringData:
  cosign.pub: |
    -----BEGIN PUBLIC KEY-----
    MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEQnb8XZOOPgUSDI8tQjLu0u1e/5eY
    ducqV7wDm9bsY4Q9Q0hG4p4SHFZ/Lbz+5OkLhwtg6pI0FqmOT7QgNzWwVg==
    -----END PUBLIC KEY-----
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: neuromesh-agent
  namespace: neuromesh-system
  labels:
    app.kubernetes.io/name: neuromesh-agent
    app.kubernetes.io/component: ebpf-sensor
    app.kubernetes.io/part-of: neuromesh
    app.kubernetes.io/version: "0.1.0"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: neuromesh-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neuromesh-agent
        app.kubernetes.io/component: ebpf-sensor
        app.kubernetes.io/part-of: neuromesh
      annotations:
        container.apparmor.security.beta.kubernetes.io/agent: unconfined
    spec:
      serviceAccountName: neuromesh-agent
      hostPID: true
      hostNetwork: false
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: agent
          # CI publishes neuromesh-agent-ebpf-sensor (:ci / :<sha>), not agent-ebpf-sensor:0.1.0.
          # Digest from main CI after #191 (SHA 3e462e3 / run 34152176424) — Cosign-signed
          # linux/amd64. Issue #192 refreshes stale @sha256:413424ce… pin.
          image: ghcr.io/neuromesh-security/neuromesh-agent-ebpf-sensor@sha256:b46687a2ca36fae234429507a5c7c7d4c6f8af33974609c7691b5ee3574bcd48
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/agent-ebpf-sensor"]
          env:
            # Issue #193: global warn keeps dependency crates quiet; raise only
            # neuromesh::policy_sync so PE sync diagnostics (incl. HTTP 429
            # throttle warn + apply/armed info) stay visible without a live
            # RUST_LOG override. EnvFilter: target=info includes warn/error.
            - name: RUST_LOG
              value: "warn,neuromesh::policy_sync=info"
            - name: NEUROMESH_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Issue #44 Phase 1: Cosign static public key (same key material
            # intended for image signing / webhook verify). Manifest+sig are
            # baked into the image; the public key is mounted so the trust
            # root is not solely under the same writeable rootfs as the
            # attested artifacts. (Admission webhook enforcement of image
            # Cosign signatures is a separate deploy dependency — not shipped
            # under deploy/ today.)
            - name: NEUROMESH_COSIGN_PUBLIC_KEY_PATH
              value: /etc/neuromesh/cosign/cosign.pub
            - name: NEUROMESH_BYTECODE_MANIFEST_PATH
              value: /etc/neuromesh/bytecode-manifest.json
            - name: NEUROMESH_BYTECODE_MANIFEST_SIG_PATH
              value: /etc/neuromesh/bytecode-manifest.sig
            # Issue #55: shared bearer for GET /v1/policy-bundle (Secret mount).
            - name: NEUROMESH_POLICY_BUNDLE_TOKEN_FILE
              value: /etc/neuromesh/policy-bundle/token
            # Phase 1 policy sync — ClusterIP DNS for zt-policy-engine.
            # If unset: sync disabled; agent enforces bootstrap deny only.
            # If set but PE not Ready: sync attempts fail; agent keeps
            # bootstrap/LKG deny (fail-closed) and does NOT crash solely from
            # PE outage. Prefer PE Ready before rolling the DaemonSet so the
            # first sync succeeds (identity exceptions stay Invalid until then).
            - name: NEUROMESH_ZT_POLICY_ENGINE_URL
              value: http://neuromesh-zt-policy-engine.neuromesh-system.svc.cluster.local:8080
            # Issue #108: DEDICATED policy-bundle VERIFY public key (NOT the
            # image/bytecode Cosign key at NEUROMESH_COSIGN_PUBLIC_KEY_PATH).
            # Same keypair as PE Secret neuromesh-policy-bundle-signing-key
            # (public half). Do not rely on Cosign-path fallback.
            - name: NEUROMESH_POLICY_BUNDLE_PUBLIC_KEY_PATH
              value: /etc/neuromesh/policy-bundle-pubkey/bundle.pub
            # Slice 2a: NEVER set NEUROMESH_IDENTITY_ALLOW_CGROUP_IDS here.
            # That env is lab/test-only manual cgroup seeding (loud SECURITY WARNING).
            # Production auto-correlation is Slice 2b-ii — not this DaemonSet seed.
            # Slice 2b-i: enable invalidation correlator (pod DELETE + cgroup teardown).
            - name: NEUROMESH_IDENTITY_CORRELATOR
              value: "1"
            - name: NEUROMESH_CGROUP_ROOT
              value: /host/sys/fs/cgroup
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add:
                - BPF
                - SYS_ADMIN
                - SYS_RESOURCE
                - PERFMON
                - SYS_PTRACE
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          volumeMounts:
            - name: sys-fs-bpf
              mountPath: /sys/fs/bpf
            - name: debugfs
              mountPath: /sys/kernel/debug
              readOnly: true
            - name: tracefs
              mountPath: /sys/kernel/tracing
              readOnly: true
            - name: host-root
              mountPath: /host
              readOnly: true
              mountPropagation: HostToContainer
            - name: tmp
              mountPath: /tmp
            - name: cosign-pubkey
              mountPath: /etc/neuromesh/cosign
              readOnly: true
            - name: policy-bundle-token
              mountPath: /etc/neuromesh/policy-bundle
              readOnly: true
            - name: policy-bundle-pubkey
              mountPath: /etc/neuromesh/policy-bundle-pubkey
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: sys-fs-bpf
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
            type: Directory
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: tmp
          emptyDir: {}
        # Secret neuromesh-cosign-pubkey is defined at the top of this file
        # (ci-cosign.pub). Full `kubectl apply -f` required — `kubectl set image`
        # does not create volumes/mounts/secrets and will CrashLoop with
        # "Cosign public key missing at /etc/neuromesh/cosign/cosign.pub".
        - name: cosign-pubkey
          secret:
            secretName: neuromesh-cosign-pubkey
            items:
              - key: cosign.pub
                path: cosign.pub
        # Issue #55: shared policy-bundle bearer token (same Secret class as Cosign):
        #   kubectl -n neuromesh-system create secret generic neuromesh-policy-bundle-token \
        #     --from-literal=token="$$(openssl rand -hex 32)"
        - name: policy-bundle-token
          secret:
            secretName: neuromesh-policy-bundle-token
            items:
              - key: token
                path: token
        # Issue #108 dedicated verify pubkey (public half of PE signing key):
        #   kubectl -n neuromesh-system create secret generic neuromesh-policy-bundle-pubkey \
        #     --from-file=bundle.pub=./policy-bundle.pub
        - name: policy-bundle-pubkey
          secret:
            secretName: neuromesh-policy-bundle-pubkey
            items:
              - key: bundle.pub
                path: bundle.pub
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: neuromesh-agent
  namespace: neuromesh-system
  labels:
    app.kubernetes.io/name: neuromesh-agent
    app.kubernetes.io/part-of: neuromesh
