# Issue #137 PR-1 — DesiredPolicy ConfigMap + watch-only RBAC (bundle plane).
#
# ★ SAFETY RAIL (do NOT enable in production until PR-2 / Rego) ★
# The PE Deployment does NOT set NEUROMESH_DESIRED_POLICY_ENABLE. Applying this
# file alone installs RBAC + an example ConfigMap; PE continues to serve the
# compile-time bootstrap bundle until BOTH env vars are set on the Deployment:
#   NEUROMESH_DESIRED_POLICY_ENABLE=true
#   NEUROMESH_DESIRED_POLICY_CONFIGMAP=neuromesh-desired-policy
# Enabling without Rego PR-2 creates dynamic-bundle + static-Rego drift — forbidden.
#
# PE ServiceAccount: get + watch ONLY on this ConfigMap (no create/update/patch/delete).
# Operators / GitOps mutate the ConfigMap; PE never writes policy.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: neuromesh-desired-policy
  namespace: neuromesh-system
  labels:
    app.kubernetes.io/name: neuromesh-zt-policy-engine
    app.kubernetes.io/component: desired-policy
    app.kubernetes.io/part-of: neuromesh
  annotations:
    neuromesh.security/desired-policy-plane: bundle-only-pr1
    neuromesh.security/rego-coupling: "blocked-until-pr2"
data:
  # Schema matches policybundle.CurrentAt content fields (deny + identity).
  # Timestamps / not_before / not_after are minted by PE on each GET — not here.
  policy.json: |
    {
      "deny_path_prefixes": ["/tmp/", "/dev/shm/", "/var/tmp/"],
      "identity_allow_exceptions": {
        "scope_path_prefix": "/tmp/",
        "spiffe_ids": [
          "spiffe://neuromesh.security/ns/default/sa/agent-ebpf-sensor",
          "spiffe://neuromesh.security/ns/default/sa/zt-policy-engine",
          "spiffe://neuromesh.security/ns/default/sa/ai-threat-detector"
        ]
      }
    }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: neuromesh-zt-policy-engine-desired-policy
  namespace: neuromesh-system
  labels:
    app.kubernetes.io/name: neuromesh-zt-policy-engine
    app.kubernetes.io/component: desired-policy
    app.kubernetes.io/part-of: neuromesh
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["neuromesh-desired-policy"]
    verbs: ["get", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: neuromesh-zt-policy-engine-desired-policy
  namespace: neuromesh-system
  labels:
    app.kubernetes.io/name: neuromesh-zt-policy-engine
    app.kubernetes.io/component: desired-policy
    app.kubernetes.io/part-of: neuromesh
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: neuromesh-zt-policy-engine-desired-policy
subjects:
  - kind: ServiceAccount
    name: neuromesh-zt-policy-engine
    namespace: neuromesh-system
