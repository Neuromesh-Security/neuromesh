[package]
name = "datadog-forwarder"
version = "0.1.0"
edition = "2021"
description = "Kafka slow-path consumer forwarding Neuromesh alerts to Datadog Logs API v2"

[[bin]]
name = "datadog-forwarder"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = "0.7"
prometheus = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rskafka = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
    "net",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.36", features = ["macros", "rt-multi-thread", "time", "net"] }
